<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aquarium Presentation Template</title>
<style>
  @page { size: A4 landscape; margin: 0; }
  html, body { margin:0; padding:0; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  * { box-sizing:border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body { font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif; background:#45c5f1; }
  .page {
    width:297mm; height:210mm; position:relative; overflow:hidden; page-break-after:always; color:#fff;
    background:
      radial-gradient(circle at 8% 10%, rgba(255,255,255,.16) 0 14px, transparent 15px),
      radial-gradient(circle at 14% 18%, rgba(255,255,255,.11) 0 9px, transparent 10px),
      radial-gradient(circle at 88% 11%, rgba(255,255,255,.14) 0 12px, transparent 13px),
      linear-gradient(180deg, #62d8ff 0%, #3ebff0 25%, #2fa6dd 54%, #2596cf 100%) !important;
  }
  .page:last-child{ page-break-after:auto; }
  .topband{ position:absolute; left:0; top:0; width:100%; height:96px; background:linear-gradient(90deg, rgba(255,255,255,.20), rgba(255,255,255,.08)); }
  .bottom-reef{ position:absolute; left:0; bottom:0; width:100%; height:95px; background:
      radial-gradient(ellipse at 8% 100%, rgba(255,209,102,.95) 0 20%, transparent 21%),
      radial-gradient(ellipse at 18% 100%, rgba(123,211,137,.98) 0 18%, transparent 19%),
      radial-gradient(ellipse at 28% 100%, rgba(255,138,91,.95) 0 17%, transparent 18%),
      radial-gradient(ellipse at 78% 100%, rgba(123,211,137,.98) 0 18%, transparent 19%),
      radial-gradient(ellipse at 90% 100%, rgba(255,138,91,.92) 0 22%, transparent 23%); }
  .content{ position:relative; z-index:3; display:grid; grid-template-columns:1.02fr 0.98fr; gap:15mm; padding:18mm 18mm 28mm 18mm; height:100%; }
  .title-chip{ display:inline-block; padding:12px 24px; border-radius:24px; color:#fff; font-size:30px; font-weight:900; margin-top:7mm; box-shadow:0 10px 22px rgba(0,0,0,.12); }
  .blue .title-chip{ background:#2eaee9; }
  .orange .title-chip{ background:#ff8a5b; }
  .green .title-chip{ background:#68c98f; }
  .yellow .title-chip{ background:#f7bf3c; color:#355070; }
  .en-title{ margin-top:12px; font-size:26px; font-weight:800; color:#fff; text-shadow:0 2px 5px rgba(0,0,0,.12); }
  .hero-box{ margin-top:8mm; flex:1; border-radius:30px; padding:10px; background:rgba(255,255,255,.18); border:2px solid rgba(255,255,255,.28); box-shadow:0 16px 26px rgba(27,83,117,.18); display:flex; flex-direction:column; min-height:0; }
  .hero-photo{ width:100%; flex:1; object-fit:cover; border-radius:24px; display:block; min-height:0; }
  .right{ display:flex; flex-direction:column; min-height:0; justify-content:center; }
  .text-card{ margin-top:22mm; border-radius:30px; padding:24px 26px; background:rgba(255,255,255,.18); border:2px solid rgba(255,255,255,.28); box-shadow:0 14px 24px rgba(22,84,122,.18); }
  .cn-lines{ font-size:31px; line-height:1.48; font-weight:900; color:#ffffff; text-shadow:0 2px 5px rgba(0,0,0,.10); }
  .en-lines{ margin-top:15px; font-size:24px; line-height:1.52; font-weight:800; color:#ffffff; text-shadow:0 2px 4px rgba(0,0,0,.10); }
</style>
</head>
<body>
  <!-- ========== COVER PAGE ========== -->
  <section class="page blue">
    <div class="topband"></div><div class="bottom-reef"></div>
    <div class="content blue">
      <div class="left" style="display:flex;flex-direction:column;">
        <div class="title-chip">[标题]</div>
        <div class="en-title">[English Title]</div>
        <div class="hero-box"><img class="hero-photo" src="[封面图片]" alt="封面" /></div>
      </div>
      <div class="right">
        <div class="text-card">
          <div class="cn-lines">[中文介绍文案]<br/>[第二行]</div>
          <div class="en-lines">[English intro]<br/>[Second line]</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== ANIMAL PAGE TEMPLATE ========== -->
  <!-- Copy this section for each animal you want to present -->
  <!-- Color options: blue, orange, green, yellow -->
  <section class="page [COLOR]">
    <div class="topband"></div><div class="bottom-reef"></div>
    <div class="content [COLOR]">
      <div class="left" style="display:flex;flex-direction:column;">
        <div class="title-chip">[中文标题]</div>
        <div class="en-title">[English Title]</div>
        <div class="hero-box"><img class="hero-photo" src="[动物图片]" alt="[动物名称]" /></div>
      </div>
      <div class="right">
        <div class="text-card">
          <div class="cn-lines">[中文描述文案]<br/>[第二行]</div>
          <div class="en-lines">[English description]<br/>[Second line]</div>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
